<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clube do Disco</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #0c0c0c;
    --bg2: #161614;
    --paper: #f1ece0;
    --paper-dim: #d8d2c2;
    --yellow: #e7ff3d;
    --red: #ff4433;
    --green: #6ee7a0;
    --ink: #141210;
    --muted: #8c887c;
    --line: #2b2a26;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 5px),
      var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 36px 16px;
  }

  .app{
    width: 100%;
    max-width: 460px;
  }

  h1{
    font-family: 'Archivo Black', sans-serif;
    font-weight: 400;
    font-size: clamp(32px, 8vw, 46px);
    text-align:center;
    line-height: 0.98;
    margin: 0 0 6px 0;
    color: var(--paper);
    text-transform: uppercase;
    letter-spacing: -0.01em;
  }

  .subtitle{
    text-align:center;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 26px;
    letter-spacing: 0.02em;
  }
  .subtitle b{ color: var(--yellow); font-weight:700; }

  .mode-badge{
    display:block;
    text-align:center;
    font-family:'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .mode-badge b{ color: var(--yellow); }

  .card{
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 18px;
  }

  .card h2{
    font-family:'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px 0;
  }

  label{
    display:block;
    font-family:'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 12px 0 6px 0;
  }
  label:first-of-type{ margin-top: 0; }

  select, input[type="text"]{
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    outline: none;
  }
  select:focus, input[type="text"]:focus{ border-color: var(--yellow); }

  button{
    font-family: inherit;
    cursor: pointer;
  }

  .btn-primary{
    width: 100%;
    padding: 15px;
    border-radius: 4px;
    border: none;
    background: var(--yellow);
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 16px;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .btn-primary:hover:not(:disabled){ background: #f2ff77; transform: translateY(-1px); }
  .btn-primary:disabled{ opacity: 0.5; cursor: default; }

  .btn-ghost{
    width: 100%;
    padding: 11px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--paper);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 10px;
  }
  .btn-ghost:hover{ border-color: var(--yellow); color: var(--yellow); }

  .msg{
    font-family:'Space Mono', monospace;
    font-size: 12px;
    margin-top: 12px;
    min-height: 16px;
    text-align:center;
  }
  .msg.ok{ color: var(--green); }
  .msg.err{ color: var(--red); }

  .status-list{ display:flex; flex-direction:column; gap:8px; }
  .status-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 14px;
  }
  .status-row .who{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size: 12px;
    letter-spacing: 0.08em;
  }
  .status-row .state{
    font-family:'Space Mono', monospace;
    font-size: 11px;
  }
  .state.pending{ color: var(--muted); }
  .state.done{ color: var(--green); }

  .stage{
    margin-top: 10px;
    min-height: 210px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position: relative;
  }

  .vinyl-wrap{
    display:none;
    position:relative;
    width: 180px;
    height: 180px;
  }
  .vinyl-wrap.active{ display:block; }

  .vinyl{
    width:100%; height:100%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(360deg); }
  }

  .spin-label{
    text-align:center;
    font-family:'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform:uppercase;
    color: var(--muted);
    margin-top: 16px;
  }

  .result{
    display:none;
    text-align:center;
    animation: pop 0.5s cubic-bezier(.2,1.4,.4,1);
  }
  .result.show{ display:block; }

  @keyframes pop{
    0%{ transform: scale(0.6); opacity:0; }
    60%{ transform: scale(1.06); opacity:1; }
    100%{ transform: scale(1); }
  }

  .result-label{
    font-family:'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .disc-label{
    position:relative;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle, var(--bg2) 0px, var(--bg2) 3px, #1c1c19 3px, #1c1c19 4px);
    display:flex;
    align-items:center;
    justify-content:center;
    margin: 0 auto;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }

  .disc-label::after{
    content:'';
    position:absolute;
    width: 10px; height:10px;
    background: var(--bg);
    border-radius:50%;
    z-index:2;
  }

  .center-sticker{
    width: 108px;
    height: 108px;
    border-radius: 50%;
    background: var(--paper);
    border: 1.5px dashed var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    padding: 8px;
    position: relative;
    overflow: hidden;
  }

  .center-sticker .cover-img{
    display:none;
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit: cover;
  }
  .center-sticker.has-cover .cover-img{ display:block; }
  .center-sticker.has-cover .winner-name,
  .center-sticker.has-cover .side{ display:none; }

  .center-sticker .winner-name{
    font-family:'Archivo Black', sans-serif;
    font-size: 15px;
    color: var(--ink);
    text-transform: uppercase;
    text-align:center;
    line-height:1.1;
    word-break: break-word;
  }

  .center-sticker .side{
    font-family:'Space Mono', monospace;
    font-size: 8px;
    letter-spacing:0.1em;
    color: var(--muted);
    margin-top: 4px;
  }

  .track-caption{
    margin-top: 16px;
    font-family: 'Space Mono', monospace;
    text-align:center;
  }
  .track-caption .who{
    font-family:'Archivo Black', sans-serif;
    font-size: 18px;
    text-transform: uppercase;
    color: var(--yellow);
    letter-spacing: 0.02em;
  }
  .track-caption .song{
    font-size: 12px;
    color: var(--paper);
    margin-top: 4px;
  }
  .track-caption .artist{
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .again{
    display:block;
    margin: 22px auto 0 auto;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--paper);
    font-family:'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 10px 18px;
    border-radius: 20px;
    cursor:pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .again:hover{ border-color: var(--yellow); color: var(--yellow); }

  .host-hint{
    font-family:'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-align:center;
    margin-top: 24px;
    line-height:1.6;
  }
  .host-hint code{
    color: var(--yellow);
    background: var(--bg2);
    padding: 1px 5px;
    border-radius:3px;
  }
</style>
</head>
<body>

<div class="app" id="app">

  <h1>Clube do Disco</h1>
  <div class="subtitle">4 links na fita. <b>1</b> sai vencedor.</div>

  <div id="participantView">
    <div class="card">
      <h2>Enviar minha resposta</h2>
      <label for="whoSelect">Quem é você</label>
      <select id="whoSelect">
        <option value="">Selecione...</option>
        <option value="Arthur">Arthur</option>
        <option value="Julia">Julia</option>
        <option value="Kadu">Kadu</option>
        <option value="Yasmin">Yasmin</option>
      </select>
      <label for="linkInput">Link do Spotify</label>
      <input type="text" id="linkInput" placeholder="https://open.spotify.com/track/...">
      <button class="btn-primary" id="submitBtn">Enviar resposta</button>
      <div class="msg" id="submitMsg"></div>
    </div>

    <div class="card">
      <h2>Quem já respondeu</h2>
      <div class="status-list" id="statusListParticipant"></div>
      <button class="btn-ghost" id="refreshParticipant">Atualizar</button>
    </div>
  </div>

  <div id="hostView" style="display:none;">
    <div class="mode-badge">Modo host &mdash; <b>só você vê isso</b></div>

    <div class="card">
      <h2>Respostas recebidas</h2>
      <div class="status-list" id="statusListHost"></div>
      <button class="btn-ghost" id="refreshHost">Atualizar</button>
    </div>

    <button class="btn-primary" id="sortearBtn" disabled>Girar o disco</button>
    <div class="msg err" id="errorMsg"></div>

    <div class="stage">
      <div class="vinyl-wrap" id="vinylWrap">
        <svg class="vinyl" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="98" fill="#141210"/>
          <circle cx="100" cy="100" r="98" fill="none" stroke="#2b2a26" stroke-width="1"/>
          <circle cx="100" cy="100" r="82" fill="none" stroke="#242320" stroke-width="1"/>
          <circle cx="100" cy="100" r="66" fill="none" stroke="#242320" stroke-width="1"/>
          <circle cx="100" cy="100" r="50" fill="none" stroke="#242320" stroke-width="1"/>
          <circle cx="100" cy="100" r="38" fill="#f1ece0"/>
          <circle cx="100" cy="100" r="38" fill="none" stroke="#141210" stroke-width="1.5" stroke-dasharray="3 3"/>
          <circle cx="100" cy="100" r="3" fill="#0c0c0c"/>
        </svg>
      </div>
      <div class="spin-label" id="spinLabel">girando a fita&hellip;</div>

      <div class="result" id="result">
        <div class="result-label">O nome que saiu foi</div>
        <div class="disc-label">
          <div class="center-sticker" id="centerSticker">
            <img class="cover-img" id="coverImg" alt="">
            <div class="winner-name" id="winnerName">&mdash;</div>
            <div class="side" id="winnerSide">CLUBE DO DISCO</div>
          </div>
        </div>
        <div class="track-caption" id="trackCaption"></div>
        <button class="again" id="againBtn">Girar de novo</button>
      </div>
    </div>
  </div>

  <div class="host-hint" id="hostHint"></div>
</div>

<script>
  // ======================================================================
  // COMO CONFIGURAR (leva 30 segundos, sem criar conta em lugar nenhum):
  // 1) Abra um terminal e rode:  curl -X POST https://kvdb.io/
  //    (ou visite https://kvdb.io/ pelo navegador e clique em "Create Bucket")
  // 2) Vai voltar um código tipo "8xJ3kP2mQ..." — cole ele abaixo
  // ======================================================================
  const BUCKET_ID = "A7v6CQM5caUAzE43rriTAU";
  const KV_BASE = "https://kvdb.io/" + BUCKET_ID + "/";

  const NAMES = ['Arthur', 'Julia', 'Kadu', 'Yasmin'];
  const isHost = new URLSearchParams(window.location.search).get('host') === '1';

  const participantView = document.getElementById('participantView');
  const hostView = document.getElementById('hostView');
  const hostHint = document.getElementById('hostHint');

  async function getSubmission(name){
    try{
      const res = await fetch(KV_BASE + 'submission-' + name);
      if(res.status === 404) return null;
      if(!res.ok) return null;
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    }catch(e){
      return null;
    }
  }
  async function setSubmission(name, link){
    return fetch(KV_BASE + 'submission-' + name, {
      method: 'POST',
      body: JSON.stringify({ link, ts: Date.now() })
    });
  }
  async function getAllSubmissions(){
    const entries = {};
    for(const name of NAMES){
      entries[name] = await getSubmission(name);
    }
    return entries;
  }

  function renderStatusList(container, entries){
    container.innerHTML = '';
    NAMES.forEach(name => {
      const row = document.createElement('div');
      row.className = 'status-row';
      const done = !!entries[name];
      row.innerHTML = '<span class="who">' + name + '</span><span class="state ' + (done ? 'done' : 'pending') + '">' + (done ? 'enviado \u2713' : 'aguardando') + '</span>';
      container.appendChild(row);
    });
  }

  if(!isHost){
    hostView.style.display = 'none';
    participantView.style.display = 'block';
    hostHint.innerHTML = 'Este link é para participantes. Quem estiver organizando o sorteio deve abrir com <code>?host=1</code> no final do endereço.';

    const whoSelect = document.getElementById('whoSelect');
    const linkInput = document.getElementById('linkInput');
    const submitBtn = document.getElementById('submitBtn');
    const submitMsg = document.getElementById('submitMsg');
    const statusListParticipant = document.getElementById('statusListParticipant');
    const refreshParticipant = document.getElementById('refreshParticipant');

    function isSpotifyLink(url){ return /open\.spotify\.com\//.test(url); }

    async function refreshStatusParticipant(){
      const entries = await getAllSubmissions();
      renderStatusList(statusListParticipant, entries);
    }

    submitBtn.addEventListener('click', async () => {
      submitMsg.textContent = '';
      submitMsg.className = 'msg';
      const name = whoSelect.value;
      const link = linkInput.value.trim();

      if(!name){
        submitMsg.textContent = 'Selecione quem você é.';
        submitMsg.classList.add('err');
        return;
      }
      if(!isSpotifyLink(link)){
        submitMsg.textContent = 'Cole um link válido do Spotify.';
        submitMsg.classList.add('err');
        return;
      }

      submitBtn.disabled = true;
      try{
        await setSubmission(name, link);
        submitMsg.textContent = 'Recebido! Sua resposta foi enviada \u2713';
        submitMsg.classList.add('ok');
        linkInput.value = '';
        refreshStatusParticipant();
      }catch(e){
        submitMsg.textContent = 'Deu erro ao enviar, tenta de novo.';
        submitMsg.classList.add('err');
      }
      submitBtn.disabled = false;
    });

    refreshParticipant.addEventListener('click', refreshStatusParticipant);
    refreshStatusParticipant();
    setInterval(refreshStatusParticipant, 5000);
  }

  if(isHost){
    hostView.style.display = 'block';
    participantView.style.display = 'none';
    hostHint.innerHTML = 'Você está no modo host. Envie o link <b>sem</b> <code>?host=1</code> para os participantes &mdash; só você deve usar este link com o parâmetro.';

    const statusListHost = document.getElementById('statusListHost');
    const refreshHost = document.getElementById('refreshHost');
    const sortearBtn = document.getElementById('sortearBtn');
    const errorMsg = document.getElementById('errorMsg');
    const vinylWrap = document.getElementById('vinylWrap');
    const spinLabel = document.getElementById('spinLabel');
    const result = document.getElementById('result');
    const centerSticker = document.getElementById('centerSticker');
    const coverImg = document.getElementById('coverImg');
    const winnerName = document.getElementById('winnerName');
    const winnerSide = document.getElementById('winnerSide');
    const trackCaption = document.getElementById('trackCaption');
    const againBtn = document.getElementById('againBtn');

    let currentEntries = {};
    let isDrawing = false;

    function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

    async function getSpotifyMeta(url){
      const res = await fetch('https://open.spotify.com/oembed?url=' + encodeURIComponent(url));
      if(!res.ok) throw new Error('oembed failed');
      return res.json();
    }

    async function refreshStatusHost(){
      if(isDrawing) return;
      errorMsg.textContent = '';
      currentEntries = await getAllSubmissions();
      renderStatusList(statusListHost, currentEntries);
      const allDone = NAMES.every(n => !!currentEntries[n]);
      sortearBtn.disabled = !allDone;
      if(!allDone){
        errorMsg.textContent = 'Ainda faltam respostas. Atualize quando todos enviarem.';
      }
    }

    async function draw(){
      errorMsg.textContent = '';
      const names = NAMES.filter(n => currentEntries[n]);
      if(names.length < 2){
        errorMsg.textContent = 'Preciso de pelo menos 2 respostas para sortear.';
        return;
      }

      isDrawing = true;
      result.classList.remove('show');
      centerSticker.classList.remove('has-cover');
      coverImg.removeAttribute('src');
      trackCaption.innerHTML = '';
      vinylWrap.classList.add('active');
      spinLabel.style.display = 'block';
      sortearBtn.disabled = true;

      const winnerPerson = names[Math.floor(Math.random() * names.length)];
      const winnerLink = currentEntries[winnerPerson].link;

      const results = await Promise.all([
        getSpotifyMeta(winnerLink).catch(() => null),
        sleep(1600)
      ]);
      const meta = results[0];

      vinylWrap.classList.remove('active');
      spinLabel.style.display = 'none';

      winnerName.textContent = winnerPerson;
      winnerSide.textContent = 'CLUBE DO DISCO';

      if(meta && meta.thumbnail_url){
        coverImg.src = meta.thumbnail_url;
        centerSticker.classList.add('has-cover');
        trackCaption.innerHTML = '<div class="who">' + winnerPerson + '</div><div class="song">' + (meta.title || '') + '</div><div class="artist">' + (meta.provider_name || 'Spotify') + (meta.author_name ? ' \u00b7 ' + meta.author_name : '') + '</div>';
      } else {
        trackCaption.innerHTML = '<div class="artist">Não achei a capa desse link, mas o sorteio valeu.</div>';
      }

      result.classList.add('show');
      sortearBtn.disabled = false;
      isDrawing = false;
    }

    sortearBtn.addEventListener('click', draw);
    refreshHost.addEventListener('click', refreshStatusHost);
    againBtn.addEventListener('click', () => result.classList.remove('show'));

    refreshStatusHost();
    setInterval(refreshStatusHost, 5000);
  }
</script>

</body>
</html>
