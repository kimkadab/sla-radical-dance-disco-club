<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clube do Disco</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #0c0c0c;
    --bg2: #161614;
    --paper: #f1ece0;
    --yellow: #e7ff3d;
    --red: #ff4433;
    --green: #6ee7a0;
    --ink: #141210;
    --muted: #8c887c;
    --line: #2b2a26;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 5px),
      var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--paper);
    padding: 40px 16px 60px 16px;
  }

  .app{
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
  }

  h1{
    font-family: 'Archivo Black', sans-serif;
    font-weight: 400;
    font-size: clamp(32px, 8vw, 46px);
    text-align:center;
    line-height: 0.98;
    margin: 0 0 6px 0;
    text-transform: uppercase;
    letter-spacing: -0.01em;
  }

  .subtitle{
    text-align:center;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 32px;
    letter-spacing: 0.02em;
  }
  .subtitle b{ color: var(--yellow); font-weight:700; }

  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 400px){
    .grid{ grid-template-columns: 1fr; }
  }

  .card{
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    display:flex;
    flex-direction:column;
  }

  .cover{
    position:relative;
    width:100%;
    aspect-ratio: 1 / 1;
    background:
      repeating-radial-gradient(circle, #1c1c19 0px, #1c1c19 2px, var(--bg2) 2px, var(--bg2) 4px);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .cover img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit: cover;
    display:none;
  }
  .cover.has-cover img{ display:block; }

  .cover .placeholder{
    font-family:'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align:center;
    padding: 0 14px;
  }
  .cover.has-cover .placeholder{ display:none; }

  .cover .edit-btn{
    position:absolute;
    top: 8px;
    right: 8px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: rgba(12,12,12,0.7);
    color: var(--yellow);
    font-size: 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index: 2;
  }
  .cover .edit-btn:hover{ background: rgba(12,12,12,0.9); }

  .info{
    padding: 10px 12px 12px 12px;
  }
  .info .who{
    font-family:'Archivo Black', sans-serif;
    font-size: 13px;
    text-transform: uppercase;
    color: var(--yellow);
  }
  .info .song{
    font-family:'Space Mono', monospace;
    font-size: 10.5px;
    color: var(--paper);
    margin-top: 4px;
    line-height:1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .info .artist{
    font-family:'Space Mono', monospace;
    font-size: 9.5px;
    color: var(--muted);
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .edit-panel{
    display:none;
    padding: 10px 12px 12px 12px;
    border-top: 1px solid var(--line);
    background: var(--bg);
  }
  .edit-panel.open{ display:block; }

  .edit-panel input{
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    padding: 9px 10px;
    outline: none;
  }
  .edit-panel input:focus{ border-color: var(--yellow); }

  .edit-panel .row{
    display:flex;
    gap: 6px;
    margin-top: 8px;
  }

  .btn-mini{
    flex:1;
    font-family:'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 8px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
  }
  .btn-save{ background: var(--yellow); color: var(--ink); font-weight:700; }
  .btn-save:hover{ background: #f2ff77; }
  .btn-cancel{ background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .btn-cancel:hover{ border-color: var(--paper); color: var(--paper); }

  .card-msg{
    font-family:'Space Mono', monospace;
    font-size: 9.5px;
    margin-top: 6px;
    min-height: 12px;
  }
  .card-msg.ok{ color: var(--green); }
  .card-msg.err{ color: var(--red); }

  .footer-note{
    font-family:'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-align:center;
    margin-top: 30px;
    line-height:1.6;
  }
</style>
</head>
<body>

<div class="app">
  <h1>Clube do Disco</h1>
  <div class="subtitle">4 vagas. <b>Cole seu link</b>, edite quando quiser.</div>

  <div class="grid" id="grid"></div>

  <div class="footer-note">Qualquer pessoa com este link pode ver e trocar os álbuns.</div>
</div>

<script>
  // ======================================================================
  // COMO CONFIGURAR (30 segundos, sem criar conta):
  // 1) No terminal:  curl -X POST https://kvdb.io/
  //    (ou abra https://kvdb.io/ no navegador e crie um bucket)
  // 2) Cole o código retornado abaixo, em BUCKET_ID
  // ======================================================================
  const BUCKET_ID = "AfHxqtXhtUsvBHNjQj7VYe";
  const KV_BASE = "https://kvdb.io/" + AfHxqtXhtUsvBHNjQj7VYe + "/";

  const NAMES = ['Arthur', 'Julia', 'Kadu', 'Yasmin'];
  const grid = document.getElementById('grid');

  function isSpotifyLink(url){ return /open\.spotify\.com\//.test(url); }

  async function getEntry(name){
    try{
      const res = await fetch(KV_BASE + 'album-' + name);
      if(res.status === 404) return null; // confirmado: não existe ainda
      if(!res.ok) return undefined; // erro temporário (ex: limite de requisições) — não mexe na tela
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    }catch(e){
      return undefined; // falha de rede — não mexe na tela
    }
  }
  async function setEntry(name, link, meta){
    return fetch(KV_BASE + 'album-' + name, {
      method: 'POST',
      body: JSON.stringify({ link, meta: meta || null, ts: Date.now() })
    });
  }

  async function getSpotifyMeta(url){
    const res = await fetch('https://open.spotify.com/oembed?url=' + encodeURIComponent(url));
    if(!res.ok) throw new Error('oembed failed');
    return res.json();
  }

  // build the 4 cards
  const cardRefs = {};

  NAMES.forEach(name => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="cover" id="cover-${name}">
        <img id="img-${name}" alt="">
        <div class="placeholder">Aguardando<br>o link de ${name}</div>
        <button class="edit-btn" id="editbtn-${name}" title="Editar">&#9998;</button>
      </div>
      <div class="info">
        <div class="who">${name}</div>
        <div class="song" id="song-${name}"></div>
        <div class="artist" id="artist-${name}"></div>
      </div>
      <div class="edit-panel" id="panel-${name}">
        <input type="text" id="input-${name}" placeholder="Cole o link do Spotify">
        <div class="row">
          <button class="btn-mini btn-save" id="save-${name}">Salvar</button>
          <button class="btn-mini btn-cancel" id="cancel-${name}">Cancelar</button>
        </div>
        <div class="card-msg" id="msg-${name}"></div>
      </div>
    `;
    grid.appendChild(card);

    cardRefs[name] = {
      cover: card.querySelector(`#cover-${name}`),
      img: card.querySelector(`#img-${name}`),
      song: card.querySelector(`#song-${name}`),
      artist: card.querySelector(`#artist-${name}`),
      panel: card.querySelector(`#panel-${name}`),
      input: card.querySelector(`#input-${name}`),
      msg: card.querySelector(`#msg-${name}`),
      editBtn: card.querySelector(`#editbtn-${name}`),
      saveBtn: card.querySelector(`#save-${name}`),
      cancelBtn: card.querySelector(`#cancel-${name}`),
    };

    cardRefs[name].editBtn.addEventListener('click', () => {
      cardRefs[name].panel.classList.toggle('open');
    });
    cardRefs[name].cancelBtn.addEventListener('click', () => {
      cardRefs[name].panel.classList.remove('open');
      cardRefs[name].msg.textContent = '';
    });
    cardRefs[name].saveBtn.addEventListener('click', () => saveLink(name));
  });

  async function saveLink(name){
    const refs = cardRefs[name];
    const link = refs.input.value.trim();
    refs.msg.textContent = '';
    refs.msg.className = 'card-msg';

    if(!isSpotifyLink(link)){
      refs.msg.textContent = 'Cole um link válido do Spotify.';
      refs.msg.classList.add('err');
      return;
    }

    refs.saveBtn.disabled = true;
    refs.msg.textContent = 'Salvando...';

    let meta = null;
    try{ meta = await getSpotifyMeta(link); }catch(e){ meta = null; }

    try{
      await setEntry(name, link, meta);
      refs.msg.textContent = 'Atualizado ✓';
      refs.msg.classList.add('ok');
      refs.input.value = '';
      renderCard(name, { link, meta, ts: Date.now() });
      setTimeout(() => { refs.panel.classList.remove('open'); refs.msg.textContent = ''; }, 900);
    }catch(e){
      refs.msg.textContent = 'Deu erro ao salvar, tenta de novo.';
      refs.msg.classList.add('err');
    }
    refs.saveBtn.disabled = false;
  }

  function renderCard(name, entry){
    const refs = cardRefs[name];
    if(entry && entry.meta && entry.meta.thumbnail_url){
      refs.img.src = entry.meta.thumbnail_url;
      refs.cover.classList.add('has-cover');
      refs.song.textContent = entry.meta.title || '';
      refs.artist.textContent = (entry.meta.provider_name || 'Spotify') + (entry.meta.author_name ? ' · ' + entry.meta.author_name : '');
    } else if(entry && entry.link){
      refs.cover.classList.remove('has-cover');
      refs.song.textContent = 'Link salvo, capa indisponível';
      refs.artist.textContent = '';
    } else {
      refs.cover.classList.remove('has-cover');
      refs.song.textContent = '';
      refs.artist.textContent = '';
    }
  }

  async function loadAll(){
    for(const name of NAMES){
      const entry = await getEntry(name);
      if(entry !== undefined){
        renderCard(name, entry);
      }
    }
  }

  loadAll();
  setInterval(loadAll, 12000);
</script>

</body>
</html>
